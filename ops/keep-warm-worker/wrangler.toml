name = "piscatio-keep-warm"
main = "src/index.js"
compatibility_date = "2026-01-01"

# Every 5 minutes. Render's free plan sleeps a service after 15 minutes without inbound
# traffic, so a 5-minute beat leaves room for a missed run without the instance dropping off.
# Cloudflare runs cron triggers on its own scheduler (not the shared-runner queue GitHub
# Actions uses), which is the whole reason this exists instead of a workflow.
[triggers]
crons = ["*/5 * * * *"]
