services:
  - type: web
    name: aquai-api
    runtime: node
    plan: free
    region: frankfurt
    # `corepack enable` fails on Render's build image with EROFS (it tries to write shims into
    # the read-only /usr/bin) — installing pnpm as a normal global npm package sidesteps that.
    # `--prod=false` is required because NODE_ENV=production (needed at runtime) also applies
    # during the build step on Render, which would otherwise skip devDependencies — including
    # typescript and the @aquai/tsconfig workspace package the build itself needs.
    buildCommand: >-
      npm install -g pnpm@9.15.0 &&
      pnpm install --frozen-lockfile --prod=false &&
      pnpm --filter @aquai/types run build &&
      pnpm --filter @aquai/validation run build &&
      pnpm --filter @aquai/api exec prisma generate &&
      pnpm --filter @aquai/api run build
    # Folded into startCommand (not preDeployCommand, which is gated to paid plans on Render) —
    # `prisma migrate deploy` only applies pending migrations, so re-running it on every free-tier
    # cold start (the instance sleeps after 15 min idle) is a safe no-op once the schema is current.
    startCommand: pnpm --filter @aquai/api exec prisma migrate deploy && node apps/api/dist/main.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_JWKS_URL
        sync: false
      - key: CLERK_ISSUER
        sync: false
      - key: CLERK_WEBHOOK_SIGNING_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: WEB_APP_URL
        sync: false
